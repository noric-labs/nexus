# Torment Nexus. Packages come from gominimal/pkgs plus our sideload, noric-labs/torment-pkgs
# (libfiu, libfaketime, torment-seed, frotz, zork-stories, brogue-ce, greed, dcss).
# Sideload packages cannot be added with `min add`; list them in `packages` by hand.
#
# Host flow (scripts/host-up.sh, see scripts/README.md): one session per lane plus one
# scoreboard session, all activated from this checkout so the repo lands at /workbench.

[upstream]
repo = "https://github.com/gominimal/pkgs"
branch = "main"
locked_commit = "4f163b52467e3dc4b2713ded70f9249b6862b3a2"

[[upstream.sideload]]
repo = "https://github.com/noric-labs/torment-pkgs"
branch = "main"
locked_commit = "862fde5d6cc059e97d9d36a08cb84fdb7dfee12e"

[defaults]
state_key = "nexus"

# Every session activated from this checkout (the scoreboard and each lane) gets these.
# host-up.sh starts scripts/scoreboard.sh and scripts/lane.sh in the session's own box with
# `min session exec`, so the session needs what the tasks below need. `go` is only used by
# the scoreboard session; a project has one [session] block, so lanes carry it too
# (hardlinked from the store, so the cost is small).
[session]
packages = ["base", "bash", "coreutils", "curl", "python", "node", "tmux", "go", "strace", "util-linux", "procps-ng",
            "frotz", "zork-stories", "brogue-ce", "greed", "bastet", "nsnake", "pacman4console", "dcss",
            "libfiu", "libfaketime", "torment-seed", "torment-crashtrace", "llvm", "pi-next"]

# Scoreboard on 0.0.0.0:8080.
#   min task run scoreboard --heat 3m --pit 15s     (args; `min session run` uses the defaults)
[tasks.scoreboard]
description = "Build and run the Torment Nexus scoreboard on 0.0.0.0:8080"
packages = ["base", "bash", "coreutils", "go"]
args.heat = { type = "string", help = "heat length (Go duration)", default = "15m" }
args.pit = { type = "string", help = "pit length (Go duration)", default = "1m" }
bash = "bash scripts/scoreboard.sh --heat '%{heat}' --pit '%{pit}'"

# `bash` (not `exec`) so the quoted, possibly empty %{args} survive as single words.
# One lane: harness + pi agent. Config comes from $HOME/.nexus/lane.env (written by
# host-up.sh), then from these args; an empty arg means "keep the env file's value".
#   min task run lane --id l-001 --game greed --mock 1 --seconds 120 --scoreboard http://…
[tasks.lane]
description = "One Torment Nexus lane: nexus-lane harness + pi agent (NEXUS_* from lane.env or args)"
packages = ["base", "bash", "coreutils", "curl", "python", "node", "tmux",
            "frotz", "zork-stories", "brogue-ce", "greed", "libfiu", "torment-seed", "torment-crashtrace", "llvm"]
args.id = { type = "string", help = "lane id, e.g. l-001", default = "" }
args.game = { type = "string", help = "frotz-zork1 | brogue | brogue-rel | greed | dcss", default = "" }
args.fault = { type = "string", help = "fault profile", default = "" }
args.seed = { type = "string", help = "u64 seed", default = "" }
args.model = { type = "string", help = "Workers AI model id", default = "" }
args.scoreboard = { type = "string", help = "scoreboard base URL", default = "" }
args.mock = { type = "string", help = "1 = in-box mock model instead of the broker", default = "" }
args.seconds = { type = "string", help = "stop after N seconds (0 = run until stopped)", default = "" }
bash = "bash scripts/lane.sh --id '%{id}' --game '%{game}' --fault '%{fault}' --seed '%{seed}' --model '%{model}' --scoreboard '%{scoreboard}' --mock '%{mock}' --seconds '%{seconds}'"

# M1 local slice: scoreboard + mock model + 3 lanes in one box (scripts/README.md).
# Builds .build/scoreboard and .build/pi first, so a fresh checkout works.
[tasks.slice]
description = "M1 local slice: scoreboard, mock model and 3 lanes in one box"
packages = ["base", "bash", "coreutils", "curl", "python", "node", "tmux", "go",
            "frotz", "zork-stories", "brogue-ce", "greed", "libfiu", "torment-seed", "torment-crashtrace", "llvm"]
bash = "(cd scoreboard && CGO_ENABLED=0 go build -o ../.build/scoreboard .) && { test -x .build/pi/node_modules/.bin/pi || npm install --prefix .build/pi --no-fund --no-audit @earendil-works/pi-coding-agent; } && bash scripts/slice.sh"

# Scenario slices used during development (D-022..D-029). Same runner as `slice`; they
# assume .build/scoreboard and .build/pi exist (run `min task run slice` once first).
# Tasks marked LIVE send real Workers AI traffic through the broker (about $0.25 each).

[tasks.slice-faults]
description = "Allocator faults on release builds (mock model)"
packages = ["base", "bash", "coreutils", "curl", "python", "node", "tmux", "frotz", "zork-stories", "brogue-ce", "greed", "libfiu", "torment-seed", "torment-crashtrace", "llvm"]
exec = "env SLICE_SECONDS=150 SLICE_LANES='l-101 brogue-rel malloc-20pct 11;l-102 greed malloc-20pct 12;l-103 frotz-zork1 malloc-20pct 13' bash scripts/slice.sh"

[tasks.slice-new]
description = "New games and fault kinds (mock model)"
packages = ["base", "bash", "coreutils", "curl", "python", "node", "tmux", "strace", "util-linux", "frotz", "zork-stories", "brogue-ce", "greed", "bastet", "nsnake", "pacman4console", "libfiu", "libfaketime", "torment-seed", "torment-crashtrace", "llvm"]
exec = "env SLICE_SECONDS=180 SLICE_HEAT=600s SLICE_LANES='l-301 bastet winch-storm 31;l-302 nsnake-rel strace-eintr-read 32;l-303 pacman-rel malloc-20pct 33;l-304 brogue keystorm 34;l-305 greed rlimit-tight 35;l-306 frotz-zork1 time-warp 36' bash scripts/slice.sh"

[tasks.slice-dcss]
description = "DCSS fault-free lanes, for baseline hashes (mock model)"
packages = ["base", "bash", "coreutils", "curl", "python", "node", "tmux", "dcss", "torment-seed", "torment-crashtrace", "llvm"]
exec = "env SLICE_SECONDS=120 SLICE_HEAT=600s SLICE_LANES='l-401 dcss none 41;l-402 dcss none 42;l-403 dcss none 43' bash scripts/slice.sh"

[tasks.slice-toolfix]
description = "LIVE: qwen3, glm, gpt-oss through the toolfix proxy"
packages = ["base", "bash", "coreutils", "curl", "python", "node", "tmux", "frotz", "zork-stories", "brogue-ce", "greed", "torment-seed", "torment-crashtrace", "llvm"]
exec = "env SLICE_LIVE=1 SLICE_SECONDS=240 SLICE_HEAT=600s SLICE_LANES='l-501 frotz-zork1 none 51 @cf/qwen/qwen3-30b-a3b-fp8;l-502 greed none 52 @cf/zai-org/glm-4.7-flash;l-503 brogue-rel none 53 @cf/openai/gpt-oss-20b' bash scripts/slice.sh"

[tasks.slice-mixed]
description = "LIVE: 6 lanes, all four models, mixed faults"
packages = ["base", "bash", "coreutils", "curl", "python", "node", "tmux", "strace", "util-linux", "frotz", "zork-stories", "brogue-ce", "greed", "bastet", "nsnake", "libfiu", "torment-seed", "torment-crashtrace", "llvm"]
exec = "env SLICE_LIVE=1 SLICE_SECONDS=300 SLICE_HEAT=600s SLICE_LANES='l-701 brogue-rel malloc-20pct 71 @cf/google/gemma-4-26b-a4b-it;l-702 brogue-rel malloc-20pct 72 @cf/qwen/qwen3-30b-a3b-fp8;l-703 bastet winch-storm 73 @cf/zai-org/glm-4.7-flash;l-704 frotz-zork1 strace-eintr-read 74 @cf/openai/gpt-oss-20b;l-705 greed rlimit-tight 75 @cf/qwen/qwen3-30b-a3b-fp8;l-706 nsnake-rel winch-storm 76 @cf/google/gemma-4-26b-a4b-it' bash scripts/slice.sh"
