# Ghostty: Torment Nexus wall (MacBook Pro 16", 3456x2234 px panel).
# Target: ~5x10 device-pixel cells => ~691x223 cells when fullscreen over the notch.
# Use as a separate config:  open -na Ghostty --args --config-file=$PWD/wall/terminals/ghostty.conf
font-family = Menlo
font-size = 4
# nudge to exactly 5x10 device px if needed (see README):
# adjust-cell-width = 0
# adjust-cell-height = 0
window-padding-x = 0
window-padding-y = 0
window-padding-balance = false
# non-native fullscreen also uses the strip beside the notch (+7 rows)
macos-non-native-fullscreen = true
fullscreen = true
macos-titlebar-style = hidden
cursor-style-blink = false
mouse-hide-while-typing = true
confirm-close-surface = false
