# kitty: Torment Nexus wall. Launch: kitty --config wall/terminals/kitty.conf --start-as=fullscreen
font_family Menlo
font_size 4.0
# nudge to exactly 5x10 device px if the font's metrics land elsewhere (see README):
# modify_font cell_width 5px
# modify_font cell_height 10px
window_padding_width 0
placement_strategy top-left
macos_traditional_fullscreen yes
hide_window_decorations titlebar-only
cursor_blink_interval 0
confirm_os_window_close 0
