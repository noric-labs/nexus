[project]
name = "nexus-wall"
version = "0.1.0"
description = "Torment Nexus zellij wall: layout generator and pager"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wall-gen = "nexus_wall.gen:main"
wall-pager = "nexus_wall.pager:main"
wall-slot = "nexus_wall.slot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_wall"]
