# Lane tmux config (mirrors the lane/tmux.conf contract). The game window has a
# fixed size; viewers attaching (the wall) never resize it.
set -g window-size manual
set -g default-size 80x24
# No status line: it would steal a row from the 80x24 game.
set -g status off
# Keep the dead pane (and its last screen) after the game exits, so the
# launcher can capture it and respawn the game in the same session.
set -g remain-on-exit on
set -g escape-time 0
set -g history-limit 2000
