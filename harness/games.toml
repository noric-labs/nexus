# Game table for nexus-lane. Command templates:
#   {seed}    full u64 seed       {seed32}  seed % 2147483646 + 1 (frotz -s)
#   {stubs}   compiled stand-ins  {home}    $HOME
# size = [cols, rows] of the tmux window. cwd is created if missing.
# sanitizer = true sets ASAN_OPTIONS/UBSAN_OPTIONS with log_path and parses the logs.
# baseline_hashes: sanitizer stack hashes reported locally but not sent (score 0).
# status_regex: the game's status line; a visual failure (status-missing) when it has been
#   off screen for status_secs (default 30) after first appearing in the run. Menus and
#   full-screen inventories hide it too, so keep status_secs well above a menu visit.

[games.frotz-zork1]
command = ["dfrotz", "-m", "-w", "80", "-h", "24", "-s", "{seed32}", "/usr/share/zork/zork1.z3"]
version = "2.55"
size = [80, 24]
# dfrotz is line-oriented and echoes arrow-key escape bytes verbatim.
visual_ignore = ["bad-cells"]

[games.brogue]
command = ["brogue-ce-asan", "-t", "-s", "{seed32}", "-n"]
version = "1.15.1"
size = [100, 34]
cwd = "{home}/brogue"
sanitizer = true
status_regex = "Depth:"

# Release build for allocator faults: ASan replaces malloc, so libfiu's
# libc/mm/* points never fire under brogue-ce-asan.
[games.brogue-rel]
command = ["brogue-ce", "-t", "-s", "{seed32}", "-n"]
version = "1.15.1"
size = [100, 34]
cwd = "{home}/brogue"
status_regex = "Depth:"

[games.greed]
command = ["greed"]
version = "4.5"
size = [80, 24]

[games.dcss]
command = ["crawl-asan", "-seed", "{seed}", "-name", "n{seed32}", "-species", "Minotaur", "-background", "Fighter", "-extra-opt-first", "weapon=trident"]
version = "0.34.1"
size = [80, 24]
sanitizer = true
# Ambient UBSan reports with fault=none (3 lanes x 2 min, D-025); scored 0.
baseline_hashes = [
    "a592ced1f6a4",
    "53b358f7bbbe",
    "c263a34a1b74",
    "2b829db422da",
    "72fb46822cfd",
    "b54de4421bb5",
    "bf7713bece7e",
    "74e390959efd",
    "f10911b6ef2d",
    "05717aa9ace7",
    "dc7ffa91e7f4",
    "92a6740b38b3",
    "be59bc042643",
]
status_regex = "Health:"

# Local stand-ins (build with `nexus-lane build-stubs`).
[games.stub-crasher]
command = ["{stubs}/crasher"]
version = "stub"
size = [80, 24]

[games.stub-asan]
command = ["{stubs}/asan"]
version = "stub"
size = [80, 24]
sanitizer = true

[games.stub-hang]
command = ["{stubs}/hang"]
version = "stub"
size = [80, 24]


# Real-time; srand(time(NULL)), no seed flag. Writes ~/.local/share/nsnake/.
# Needs >= 80x24 (exits 1 below). Enter starts Arcade Mode; arrows steer.
[games.nsnake]
command = ["nsnake-asan"]
version = "3.0.1"
size = [80, 24]
sanitizer = true

[games.nsnake-rel]
command = ["nsnake"]
version = "3.0.1"
size = [80, 24]

# Real-time; busy-waits (100% of a core per lane). srand(time(NULL)) + rand(), so the
# torment-seed shim makes ghost moves deterministic. Needs >= 29x32; every exit is 0.
[games.pacman]
command = ["pacman4console-asan"]
version = "1.3"
size = [29, 32]
sanitizer = true
# After a resize pacman can redraw the maze garbled with ordinary characters, which the
# garbage/blank checks miss; the status line disappearing is what gives it away.
status_regex = "Level: *[0-9]+ +Score: *[0-9]+"

[games.pacman-rel]
command = ["pacman4console"]
version = "1.3"
size = [29, 32]
status_regex = "Level: *[0-9]+ +Score: *[0-9]+"

# Visual-corruption stand-in: g = garbage cells, b = blank screen, s = hide the status
# line, x = exit 3, f = write 128 KB (SIGXFSZ under rlimit-tight). See stubs/glitch.c.
[games.stub-glitch]
command = ["{stubs}/glitch"]
version = "stub"
size = [80, 24]
status_regex = "Depth:"
status_secs = 5

# Real-time (select() timeout); srandom(time(NULL)+37), which torment-seed makes
# deterministic. Needs >= 24 rows (well not drawn below), no SIGWINCH handling.
# Scores to $HOME/.bastetscores; needs HOME.
[games.bastet]
command = ["bastet-asan"]
version = "0.43.2"
size = [80, 24]
cwd = "{home}/bastet"
sanitizer = true

[games.bastet-rel]
command = ["bastet"]
version = "0.43.2"
size = [80, 24]
cwd = "{home}/bastet"
