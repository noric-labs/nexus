[project]
name = "nexus-scaletest"
version = "0.1.0"
description = "Torment Nexus scale test: phase A inference probe and an OpenAI-compatible mock"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
probe = "probe.cli:main"
mock-server = "mock_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["probe", "mock_server"]
